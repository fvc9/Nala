<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Chica & Teckel</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1a2e; overflow: hidden; touch-action: none; }
  #game { width: 100%; height: 100%; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #1b1a2e; color: #ffe9a8;
    font: 20px monospace; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="rotate">Gira tu celular para jugar</div>
<script>
/* =====================  CONFIGURACIÓN (edita aquí)  =====================
   Cada PNG es una tira horizontal de cuadros del MISMO tamaño (fw x fh).
   - girl : caminata de la chica, mirando a la DERECHA
   - dog  : carrera del teckel, mirando a la IZQUIERDA
   - kiss : escena del beso (4 cuadros)                                      */
const CONFIG = {
  TITLE: "Nala & Tefania",
  SCALE: 1.5,
  girl: { file: 'girl_walk.png', fw: 88,  fh: 128, frames: 6, fps: 10 },
  dog:  { file: 'dog_run.png',   fw: 90,  fh: 70,  frames: 6, fps: 12 },
  kiss: { file: 'kiss.png',      fw: 110, fh: 124, frames: 4, fps: 2  },
  girlJump: { file: 'girl_jump.png', fw: 80, fh: 88,  frames: 3 },   // si falta el PNG, se arma con la caminata
  items:    { file: 'items.png',     fw: 54, fh: 45,  frames: 3 },   // 0 corazón, 1 hueso, 2 caja
  run: { speed: 220, gravity: 1700, jump: 640, stun: 0.9, catchDist: 80 },
  girlSpeed: 170,
  dogStart: 70,
  dogMax: 240,
  dogRamp: 14,
  groundY: 400,
  catchDist: 75,
  STORE_KEY: 'nalaTefaniaBesos'
};

const W = 800, H = 450;
const FONT = 'monospace';

/* ---------- utilidades ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function loadKisses() {
  try { return parseInt(localStorage.getItem(CONFIG.STORE_KEY) || '0', 10) || 0; } catch (e) { return 0; }
}
function saveKisses(n) {
  try { localStorage.setItem(CONFIG.STORE_KEY, String(n)); } catch (e) {}
}

function loadBest() {
  try { return parseInt(localStorage.getItem(CONFIG.STORE_KEY + 'Best') || '0', 10) || 0; } catch (e) { return 0; }
}
function saveBest(n) {
  try { localStorage.setItem(CONFIG.STORE_KEY + 'Best', String(n)); } catch (e) {}
}
function floatText(scene, x, y, str, color) {
  const t = scene.add.text(x, y, str, { fontFamily: FONT, fontSize: '22px', color,
    stroke: '#1b1a2e', strokeThickness: 4 }).setOrigin(0.5).setDepth(15);
  scene.tweens.add({ targets: t, y: y - 50, alpha: 0, duration: 900, onComplete: () => t.destroy() });
}
function burstHearts(scene, x, y, n) {
  scene.time.addEvent({ delay: 200, repeat: n - 1, callback: () => {
    const h = scene.add.text(x + Phaser.Math.Between(-50, 50), y, '♥',
      { fontSize: '30px', color: '#ff3b5c' }).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: h, y: h.y - 90, alpha: 0, duration: 1200, onComplete: () => h.destroy() });
  }});
}
function menuButton(scene) {
  scene.add.text(W - 8, 4, 'Menú', { fontFamily: FONT, fontSize: '18px', color: '#ffffff',
    stroke: '#1b1a2e', strokeThickness: 4, padding: { x: 10, y: 8 } }).setOrigin(1, 0).setScrollFactor(0).setDepth(20)
    .setInteractive({ useHandCursor: true }).on('pointerdown', () => scene.scene.start('menu'));
}

function useTouch(scene) {
  return scene.sys.game.device.input.touch || /[?&]touch/.test(location.search);   // ?touch fuerza los botones en PC
}
function touchPad(scene, defs) {
  scene.input.addPointer(2);
  const shapes = { left: [0, 16, 20, 0, 20, 32], right: [0, 0, 0, 32, 20, 16], up: [16, 0, 0, 20, 32, 20] };
  defs.forEach(d => {
    const c = scene.add.circle(d.x, d.y, 46, 0x000000, 0.35).setStrokeStyle(3, 0xffffff, 0.85)
      .setScrollFactor(0).setDepth(40).setInteractive();
    const p = shapes[d.shape];
    scene.add.triangle(d.x, d.y, p[0], p[1], p[2], p[3], p[4], p[5], 0xffffff, 0.9)
      .setScrollFactor(0).setDepth(41);
    const down = () => { c.setFillStyle(0xffffff, 0.35); d.onDown(); };
    const up = () => { c.setFillStyle(0x000000, 0.35); if (d.onUp) d.onUp(); };
    c.on('pointerdown', down).on('pointerup', up).on('pointerout', up).on('pointerupoutside', up);
  });
}

class EndPanel {
  constructor(scene, onAgain) {
    const bg = scene.add.rectangle(W / 2, H / 2, 560, 150, 0x000000, 0.8).setStrokeStyle(3, 0xff7a90);
    this.title = scene.add.text(W / 2, H / 2 - 35, '', { fontFamily: FONT, fontSize: '22px',
      color: '#ffe9a8', align: 'center', wordWrap: { width: 520 } }).setOrigin(0.5);
    const btn = (x, label, fn) => scene.add.text(x, H / 2 + 35, label, { fontFamily: FONT, fontSize: '18px',
      color: '#ffffff', padding: { x: 12, y: 10 } }).setOrigin(0.5)
      .setInteractive({ useHandCursor: true }).on('pointerdown', fn);
    const again = btn(W / 2 - 120, 'Jugar otra vez', onAgain);
    const menu = btn(W / 2 + 120, 'Volver al menú', () => scene.scene.start('menu'));
    this.objs = [bg, this.title, again, menu];
    this.objs.forEach(o => o.setScrollFactor(0).setDepth(30));
    this.show(false);
  }
  show(v, title) {
    if (title !== undefined) this.title.setText(title);
    this.objs.forEach(o => o.setVisible(v));
  }
}

/* ---------- fondo con parallax (se dibuja por código, sin imágenes) ---------- */
function buildBackground(scene) {
  const T = scene.textures;
  if (T.exists('sky')) return;
  const gy = CONFIG.groundY;

  let c = T.createCanvas('sky', 4, gy), x = c.getContext();
  const g = x.createLinearGradient(0, 0, 0, gy);
  g.addColorStop(0, '#7ec8ff'); g.addColorStop(1, '#fde7c0');
  x.fillStyle = g; x.fillRect(0, 0, 4, gy); c.refresh();

  c = T.createCanvas('clouds', W, 160); x = c.getContext();
  x.fillStyle = 'rgba(255,255,255,0.9)';
  [[40, 60], [300, 30], [560, 80]].forEach(([cx, cy]) => {
    x.fillRect(cx, cy, 100, 22); x.fillRect(cx + 16, cy - 14, 60, 18);
  });
  c.refresh();

  const city = (key, h, col, win, seed, minW, maxW, minH) => {
    const r = rng(seed), cv = T.createCanvas(key, W, h), cx = cv.getContext();
    let px = 0;
    while (px < W) {
      let w = Math.floor(minW + r() * (maxW - minW));
      if (W - px - w < minW) w = W - px;      // el borde cierra limpio: se repite sin cortes
      const bh = Math.floor(minH + r() * (h - minH));
      cx.fillStyle = col; cx.fillRect(px, h - bh, w, bh);
      cx.fillStyle = win;
      for (let wy = h - bh + 8; wy < h - 10; wy += 14)
        for (let wx = px + 6; wx < px + w - 8; wx += 12)
          if (r() > 0.45) cx.fillRect(wx, wy, 5, 7);
      px += w;
    }
    cv.refresh();
  };
  city('cityFar', 200, '#9fb7d9', '#c6d6ee', 7, 50, 90, 80);
  city('cityNear', 130, '#5f7aa6', '#f2d98a', 21, 60, 100, 60);

  c = T.createCanvas('ground', 64, H - gy); x = c.getContext();
  x.fillStyle = '#6aa84f'; x.fillRect(0, 0, 64, H - gy);
  x.fillStyle = '#4f8a3b'; x.fillRect(0, 0, 64, 6);
  x.fillStyle = '#5b9944';
  for (let i = 0; i < 64; i += 16) { x.fillRect(i + 4, 16, 8, 4); x.fillRect(i + 12, 32, 6, 4); }
  c.refresh();
}

class Scenery {
  constructor(scene) {
    buildBackground(scene);
    this.layers = [];
    scene.add.image(0, 0, 'sky').setOrigin(0).setDisplaySize(W, CONFIG.groundY)
      .setScrollFactor(0).setDepth(-10);
    this.add(scene, 'clouds', 20, 160, 0.10, -9);
    this.add(scene, 'cityFar', CONFIG.groundY - 200, 200, 0.25, -8);
    this.add(scene, 'cityNear', CONFIG.groundY - 130, 130, 0.55, -7);
    this.add(scene, 'ground', CONFIG.groundY, H - CONFIG.groundY, 1, -6);
  }
  add(scene, key, y, h, factor, depth) {
    const t = scene.add.tileSprite(0, y, W, h, key).setOrigin(0).setScrollFactor(0).setDepth(depth);
    this.layers.push([t, factor]);
  }
  update(scrollX) {
    for (const [t, f] of this.layers) t.tilePositionX = scrollX * f;
  }
}

/* ---------- carga de sprites, provisionales y animaciones ---------- */
function loadSprites(scene) {
  scene.missing = new Set();
  scene.load.on('loaderror', f => scene.missing.add(f.key));
  for (const k of ['girl', 'dog', 'kiss', 'girlJump', 'items']) {
    const c = CONFIG[k];
    scene.load.spritesheet(k, c.file, { frameWidth: c.fw, frameHeight: c.fh });
  }
}

// Arma una tira nueva copiando cuadros de otra (respaldo cuando falta un PNG)
function fallbackStrip(scene, key, fromKey, idxs) {
  const c = CONFIG[fromKey];
  const img = scene.textures.get(fromKey).getSourceImage();
  const tex = scene.textures.createCanvas(key, c.fw * idxs.length, c.fh);
  const ctx = tex.getContext();
  idxs.forEach((f, i) => {
    ctx.drawImage(img, f * c.fw, 0, c.fw, c.fh, i * c.fw, 0, c.fw, c.fh);
    tex.add(i, 0, i * c.fw, 0, c.fw, c.fh);
  });
  tex.refresh();
}

function placeholder(scene, key, color) {
  const c = CONFIG[key];
  const tex = scene.textures.createCanvas(key, c.fw * c.frames, c.fh);
  const ctx = tex.getContext();
  for (let i = 0; i < c.frames; i++) {
    const bob = Math.sin(i / c.frames * Math.PI * 2) * 4;
    ctx.fillStyle = key === 'items' ? ['#e0203a', '#f4efe0', '#8a5a2b'][i] : color;
    if (key === 'girl' || key === 'girlJump') {
      ctx.fillRect(i * c.fw + c.fw * 0.3, c.fh * 0.3 + bob, c.fw * 0.4, c.fh * 0.7 - bob);
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(i * c.fw + c.fw * 0.3, c.fh * 0.08 + bob, c.fw * 0.4, c.fh * 0.25);
    } else {
      ctx.fillRect(i * c.fw + c.fw * 0.12, c.fh * 0.4 + bob, c.fw * 0.76, c.fh * 0.6 - bob);
    }
    tex.add(i, 0, i * c.fw, 0, c.fw, c.fh);
  }
  tex.refresh();
}

function setupAssets(scene) {
  const C = CONFIG;
  const hasKiss = !scene.missing.has('kiss');
  scene.registry.set('hasKiss', hasKiss);
  if (scene.missing.has('girl')) placeholder(scene, 'girl', '#3b5998');
  if (scene.missing.has('dog')) placeholder(scene, 'dog', '#e8c48a');
  if (scene.missing.has('girlJump')) {
    if (!scene.missing.has('girl')) fallbackStrip(scene, 'girlJump', 'girl', [1, 2, 3]);
    else placeholder(scene, 'girlJump', '#3b5998');
  }
  if (scene.missing.has('items')) placeholder(scene, 'items', '#ffffff');
  const make = (key, tex, frames, fps, repeat) => {
    if (scene.anims.exists(key)) return;
    scene.anims.create({ key, frameRate: fps, repeat,
      frames: scene.anims.generateFrameNumbers(tex, { start: 0, end: frames - 1 }) });
  };
  make('girl-walk', 'girl', C.girl.frames, C.girl.fps, -1);
  make('dog-run', 'dog', C.dog.frames, C.dog.fps, -1);
  if (hasKiss) make('kiss', 'kiss', C.kiss.frames, C.kiss.fps, 0);
}

/* =====================  MENÚ  ===================== */
class Menu extends Phaser.Scene {
  constructor() { super('menu'); }
  preload() { loadSprites(this); }

  create() {
    setupAssets(this);
    if (this.registry.get('kisses') === undefined) this.registry.set('kisses', loadKisses());
    this.scenery = new Scenery(this);
    this.scroll = 0;

    this.add.text(W / 2, 30, CONFIG.TITLE, {
      fontFamily: FONT, fontSize: '34px', color: '#ffffff', stroke: '#1b1a2e', strokeThickness: 6
    }).setOrigin(0.5).setDepth(5);

    this.card(270, 'Persecución', '¡Que no te alcance!', true, () => this.scene.start('chase'));
    this.card(530, 'Corazones al vuelo', 'Salta, recoge y escapa', true, () => this.scene.start('runner'));

    const gy = CONFIG.groundY, s = 1.2;
    const dog = this.add.sprite(230, gy, 'dog', 0).setOrigin(0.5, 1).setScale(s).setFlipX(true).setDepth(2);
    const girl = this.add.sprite(500, gy, 'girl', 0).setOrigin(0.5, 1).setScale(s).setDepth(2);
    dog.play('dog-run'); girl.play('girl-walk');

    this.count = this.add.text(16, H - 30, '', {
      fontFamily: FONT, fontSize: '18px', color: '#ffffff', stroke: '#1b1a2e', strokeThickness: 4
    }).setDepth(5);
  }

  card(x, title, sub, active, onClick) {
    const fill = active ? 0x2b2a4a : 0x3a3a3a;
    const bg = this.add.rectangle(x, 135, 230, 150, fill, active ? 0.92 : 0.75)
      .setStrokeStyle(3, active ? 0xff7a90 : 0x777777).setDepth(5);
    this.add.text(x, 105, title, { fontFamily: FONT, fontSize: '20px',
      color: active ? '#ffffff' : '#aaaaaa', align: 'center', wordWrap: { width: 210 } })
      .setOrigin(0.5).setDepth(6);
    this.add.text(x, 165, sub, { fontFamily: FONT, fontSize: '14px',
      color: active ? '#ffe9a8' : '#888888' }).setOrigin(0.5).setDepth(6);
    if (active) {
      bg.setInteractive({ useHandCursor: true })
        .on('pointerover', () => bg.setFillStyle(0x3d3b6e, 0.95))
        .on('pointerout', () => bg.setFillStyle(fill, 0.92))
        .on('pointerdown', onClick);
    }
  }

  update(_, delta) {
    this.scroll += delta * 0.12;
    this.scenery.update(this.scroll);
    this.count.setText('Besos: ' + this.registry.get('kisses'));
  }
}

/* =====================  MINIJUEGO 1: PERSECUCIÓN  ===================== */
class Chase extends Phaser.Scene {
  constructor() { super('chase'); }

  create() {
    const C = CONFIG;
    this.hasKiss = this.registry.get('hasKiss');
    this.scenery = new Scenery(this);

    this.girl = this.add.sprite(0, C.groundY, 'girl', 0).setOrigin(0.5, 1).setScale(C.SCALE).setDepth(1);
    this.dog = this.add.sprite(0, C.groundY, 'dog', 0).setOrigin(0.5, 1).setScale(C.SCALE).setDepth(1);
    this.kissSpr = this.add.sprite(0, C.groundY, 'kiss', 0).setOrigin(0.5, 1)
      .setScale(C.SCALE).setDepth(1).setVisible(false);

    const ui = { fontFamily: FONT, color: '#ffffff', stroke: '#1b1a2e', strokeThickness: 4 };
    this.hud = this.add.text(16, 12, '', { ...ui, fontSize: '18px' }).setScrollFactor(0).setDepth(20);
    this.hint = this.add.text(W / 2, 44, useTouch(this) ? '¡Corre! Usa los botones de abajo' : '¡Corre! Muévete con ← → o A D', {
      ...ui, fontSize: '16px', color: '#ffe9a8' }).setOrigin(0.5).setScrollFactor(0).setDepth(20);
    menuButton(this);
    this.panel = new EndPanel(this, () => this.reset());

    this.touch = { left: false, right: false };
    if (useTouch(this)) {
      touchPad(this, [
        { x: 80, y: 375, shape: 'left', onDown: () => { this.touch.left = true; }, onUp: () => { this.touch.left = false; } },
        { x: 200, y: 375, shape: 'right', onDown: () => { this.touch.right = true; }, onUp: () => { this.touch.right = false; } }
      ]);
    }
    this.keys = this.input.keyboard.addKeys('LEFT,RIGHT,A,D');
    this.reset();
  }

  reset() {
    const C = CONFIG;
    this.state = 'play';
    this.t = 0;
    this.touch.left = false; this.touch.right = false;
    this.girl.setVisible(true).setPosition(0, C.groundY).setFlipX(false);
    this.dog.setVisible(true).setPosition(380, C.groundY).setFlipX(false).play('dog-run');
    this.kissSpr.setVisible(false);
    this.panel.show(false);
    this.hint.setVisible(true);
    this.cameras.main.scrollX = this.girl.x - W / 2;
  }

  update(_, delta) {
    const cam = this.cameras.main;
    this.hud.setText('Besos: ' + this.registry.get('kisses'));
    cam.scrollX = Phaser.Math.Linear(cam.scrollX, this.girl.x - W / 2, 0.12);
    this.scenery.update(cam.scrollX);
    if (this.state !== 'play') return;

    const dt = delta / 1000;
    this.t += dt;
    if (this.t > 4) this.hint.setVisible(false);

    // --- chica ---
    let dir = 0;
    if (this.keys.LEFT.isDown || this.keys.A.isDown) dir = -1;
    else if (this.keys.RIGHT.isDown || this.keys.D.isDown) dir = 1;
    if (this.touch.left) dir = -1;
    else if (this.touch.right) dir = 1;
    this.girl.x += dir * CONFIG.girlSpeed * dt;
    if (dir !== 0) {
      this.girl.setFlipX(dir < 0);
      if (!this.girl.anims.isPlaying) this.girl.play('girl-walk');
    } else {
      this.girl.anims.stop();
      this.girl.setFrame(0);
    }

    // --- perro (acelera con el tiempo) ---
    const speed = Math.min(CONFIG.dogMax, CONFIG.dogStart + CONFIG.dogRamp * this.t);
    const dx = this.girl.x - this.dog.x;
    this.dog.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
    this.dog.setFlipX(dx > 0);                       // el sprite original mira a la izquierda

    if (Math.abs(dx) < CONFIG.catchDist) this.kiss();
  }

  kiss() {
    const C = CONFIG;
    this.state = 'kiss';
    const n = this.registry.get('kisses') + 1;
    this.registry.set('kisses', n);
    saveKisses(n);
    this.hint.setVisible(false);
    this.girl.anims.stop();
    this.dog.anims.stop();
    const x = (this.girl.x + this.dog.x) / 2;

    if (this.hasKiss) {
      this.girl.setVisible(false);
      this.dog.setVisible(false);
      // la hoja tiene a la chica a la izquierda y al perro a la derecha
      this.kissSpr.setVisible(true).setPosition(x, C.groundY)
        .setFlipX(this.dog.x < this.girl.x).play('kiss');
    } else {
      this.dog.setFlipX(this.girl.x > this.dog.x);
      this.tweens.add({ targets: this.dog, y: C.groundY - 60, duration: 250, yoyo: true, repeat: 2 });
    }

    burstHearts(this, x, C.groundY - 200, 9);

    this.time.delayedCall(2600, () => {
      this.state = 'msg';
      this.panel.show(true, '¡Te alcanzó!');
    });
  }
}

/* =====================  MINIJUEGO 2: CORAZONES AL VUELO  ===================== */
class Runner extends Phaser.Scene {
  constructor() { super('runner'); }

  create() {
    const C = CONFIG;
    this.hasKiss = this.registry.get('hasKiss');
    this.best = loadBest();
    this.scenery = new Scenery(this);
    this.items = [];

    this.girl = this.add.sprite(0, C.groundY, 'girl', 0).setOrigin(0.5, 1).setScale(C.SCALE).setDepth(2);
    this.dog = this.add.sprite(0, C.groundY, 'dog', 0).setOrigin(0.5, 1).setScale(C.SCALE)
      .setFlipX(true).setDepth(1);
    this.kissSpr = this.add.sprite(0, C.groundY, 'kiss', 0).setOrigin(0.5, 1)
      .setScale(C.SCALE).setDepth(3).setVisible(false);

    const ui = { fontFamily: FONT, color: '#ffffff', stroke: '#1b1a2e', strokeThickness: 4 };
    this.hud = this.add.text(16, 12, '', { ...ui, fontSize: '18px' }).setScrollFactor(0).setDepth(20);
    this.hint = this.add.text(W / 2, 70, useTouch(this) ? 'Toca el botón para saltar' : 'Salta con ESPACIO o ↑', {
      ...ui, fontSize: '16px', color: '#ffe9a8' }).setOrigin(0.5).setScrollFactor(0).setDepth(20);
    this.gapBar = this.add.graphics().setScrollFactor(0).setDepth(20);
    this.add.text(W / 2, 12, 'Perro', { ...ui, fontSize: '14px' }).setOrigin(0.5, 0)
      .setScrollFactor(0).setDepth(21);
    menuButton(this);
    this.panel = new EndPanel(this, () => this.reset());

    if (useTouch(this)) {
      touchPad(this, [{ x: W - 90, y: 365, shape: 'up', onDown: () => this.jump() }]);
    }
    this.keys = this.input.keyboard.addKeys('SPACE,UP,W');
    this.input.on('pointerdown', () => this.jump());
    this.reset();
  }

  reset() {
    const C = CONFIG;
    this.items.forEach(i => i.spr.destroy());
    this.items = [];
    this.state = 'play';
    this.t = 0; this.score = 0;
    this.jumpY = 0; this.vy = 0; this.airT = 0; this.onGround = true;
    this.stun = 0; this.dogSlow = 0;
    this.nextSpawn = 500;
    this.noJump = this.time.now + 300;   // evita saltar con el mismo toque del botón
    this.girl.setVisible(true).setAlpha(1).setPosition(0, C.groundY).anims.stop();
    this.girl.play('girl-walk');
    this.dog.setVisible(true).setPosition(-230, C.groundY).play('dog-run');
    this.kissSpr.setVisible(false);
    this.panel.show(false);
    this.hint.setVisible(true);
    this.cameras.main.scrollX = this.girl.x - 260;
  }

  jump() {
    if (this.state !== 'play' || !this.onGround || this.time.now < this.noJump) return;
    this.onGround = false;
    this.vy = -CONFIG.run.jump;
    this.airT = 0;
    this.girl.anims.stop();
    this.girl.setTexture('girlJump', 0);
  }

  addItem(type, x, y) {
    const frame = { heart: 0, bone: 1, crate: 2 }[type];
    const spr = this.add.sprite(x, y, 'items', frame).setScale(CONFIG.SCALE).setDepth(1);
    if (type === 'crate') spr.setOrigin(0.5, 1);
    this.items.push({ spr, type, done: false });
  }

  spawn(x) {
    const g = CONFIG.groundY, r = Math.random();
    if (r < 0.45) {                               // caja con arco de corazones encima
      this.addItem('crate', x, g);
      this.addItem('heart', x - 70, g - 95);
      this.addItem('heart', x, g - 150);
      this.addItem('heart', x + 70, g - 95);
    } else if (r < 0.70) {                        // fila de corazones a ras de suelo
      for (let i = 0; i < 3; i++) this.addItem('heart', x + i * 60, g - 45);
    } else if (r < 0.85) {                        // hueso (aleja al perro)
      this.addItem('bone', x, g - 60);
    } else {                                      // caja con hueso arriba
      this.addItem('crate', x, g);
      this.addItem('bone', x, g - 150);
    }
  }

  update(_, delta) {
    const C = CONFIG, R = C.run, cam = this.cameras.main;
    this.hud.setText('Corazones: ' + this.score + '   Récord: ' + this.best);
    cam.scrollX = Phaser.Math.Linear(cam.scrollX, this.girl.x - 260, 0.15);
    this.scenery.update(cam.scrollX);
    if (this.state !== 'play') return;

    const dt = delta / 1000;
    this.t += dt;
    if (this.t > 5) this.hint.setVisible(false);

    // --- chica: corre sola, tú saltas ---
    if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE) || Phaser.Input.Keyboard.JustDown(this.keys.UP)
        || Phaser.Input.Keyboard.JustDown(this.keys.W)) this.jump();

    let speed = R.speed;
    if (this.stun > 0) { this.stun -= dt; speed *= 0.35; this.girl.setAlpha(Math.floor(this.t * 12) % 2 ? 0.4 : 1); }
    else this.girl.setAlpha(1);
    this.girl.x += speed * dt;

    if (!this.onGround) {
      this.airT += dt;
      this.vy += R.gravity * dt;
      this.jumpY += this.vy * dt;
      if (this.jumpY >= 0) {
        this.jumpY = 0; this.vy = 0; this.onGround = true;
        this.girl.play('girl-walk');
      } else {
        this.girl.setFrame(this.airT < 0.1 ? 0 : (this.vy < 0 ? 1 : 2));
      }
    }
    this.girl.y = C.groundY + this.jumpY;

    // --- perro: empieza más lento y acelera ---
    this.dogSlow = Math.max(0, this.dogSlow - dt);
    let ds = R.speed * Math.min(1.12, 0.84 + 0.012 * this.t);
    if (this.dogSlow > 0) ds *= 0.4;
    this.dog.x += ds * dt;

    // --- aparición y limpieza de objetos ---
    while (this.nextSpawn < this.girl.x + 700) {
      this.spawn(this.nextSpawn);
      this.nextSpawn += Phaser.Math.Between(380, 620);
    }
    this.items = this.items.filter(it => {
      if (it.spr.x < cam.scrollX - 200) { it.spr.destroy(); return false; }
      return true;
    });

    // --- colisiones ---
    const gr = new Phaser.Geom.Rectangle(this.girl.x - 22, this.girl.y - 175, 44, 160);
    for (const it of this.items) {
      if (it.done) continue;
      const b = it.spr.getBounds();
      const r = new Phaser.Geom.Rectangle(b.x + 8, b.y + 10, b.width - 16, b.height - 14);
      if (!Phaser.Geom.Intersects.RectangleToRectangle(gr, r)) continue;
      it.done = true;
      if (it.type === 'heart') {
        this.score++;
        floatText(this, it.spr.x, it.spr.y - 20, '+1', '#ff7a90');
        it.spr.destroy();
      } else if (it.type === 'bone') {
        this.dog.x -= 170; this.dogSlow = 1.5;
        floatText(this, it.spr.x, it.spr.y - 20, '¡Hueso!', '#fff3c4');
        it.spr.destroy();
      } else {
        this.stun = R.stun;
        floatText(this, this.girl.x, this.girl.y - 200, '¡Ay!', '#ffb3b3');
        it.spr.setAlpha(0.6);
      }
    }
    this.items = this.items.filter(it => !(it.done && it.type !== 'crate'));

    // --- barra de distancia al perro ---
    const gap = this.girl.x - this.dog.x;
    const ratio = Phaser.Math.Clamp(gap / 500, 0, 1);
    this.gapBar.clear();
    this.gapBar.fillStyle(0x000000, 0.5).fillRect(W / 2 - 100, 32, 200, 12);
    this.gapBar.fillStyle(ratio < 0.3 ? 0xff5a5a : 0x6fdc7a, 1).fillRect(W / 2 - 100, 32, 200 * ratio, 12);

    if (gap < R.catchDist) this.kiss();
  }

  kiss() {
    const C = CONFIG;
    this.state = 'kiss';
    const n = this.registry.get('kisses') + 1;
    this.registry.set('kisses', n);
    saveKisses(n);
    if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
    this.hint.setVisible(false);
    this.girl.anims.stop();
    this.dog.anims.stop();
    this.gapBar.clear();
    const x = (this.girl.x + this.dog.x) / 2;

    if (this.hasKiss) {
      this.girl.setVisible(false);
      this.dog.setVisible(false);
      // la hoja tiene a la chica a la izquierda y al perro a la derecha; aquí el perro viene de atrás
      this.kissSpr.setVisible(true).setPosition(x, C.groundY).setFlipX(true).play('kiss');
    } else {
      this.girl.setPosition(this.girl.x, C.groundY);
      this.tweens.add({ targets: this.dog, y: C.groundY - 60, duration: 250, yoyo: true, repeat: 2 });
    }
    burstHearts(this, x, C.groundY - 200, 9);

    this.time.delayedCall(2600, () => {
      this.state = 'msg';
      this.panel.show(true, '¡Te alcanzó!   Corazones: ' + this.score + '   Récord: ' + this.best);
    });
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  pixelArt: true,
  backgroundColor: '#1b1a2e',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Menu, Chase, Runner]
});
</script>
